function help(){S='help';show('<h2>Help</h2><p><b>Goal:</b> Defeat soldiers to collect all 10 history books. Read them in the Journal, then enter the wormhole at the far right and put the events in order. After that, step through the wormhole to witness five turning points in history.</p><p><b>Controls:</b> Arrow keys or A/D to move, Space or W to jump, J or X to strike, B for the Journal. On a phone, use the buttons under the screen.</p><p><b>Quests:</b> Talk to people (walk up to them, or press E or Talk). Your quest list is at the top left of the screen. Gates and the wormhole stay sealed until you finish each quest. <b>Tips:</b> Jump over gunmen\'s shots. Snakes bite, so strike them first. Touch cats and dogs to make friends. Friars\' rations restore 1 HP.</p><p><b>Health rewards:</b> finishing an era quest restores <b>4 HP</b>. Finishing a Peace mission (talking and choosing wisely) restores <b>2 HP</b>. Each hidden find (the glowing books and notes) restores <b>2 HP</b>. Some helpful people, like the Old Weaver, restore <b>2 HP</b> when you talk to them. Entering a new wormhole chapter gives <b>3 HP</b>. Mining and cave quests give XP only, no HP. Falling into a cave hole and bat bites cost HP. Your HP never goes above your maximum (10 on Normal, 6 on Hard).</p><p><b>Traps and relics:</b> Traps lurk only inside caves. Stalactites fall when you linger under them: small ones cost 2 to 4 HP, big ones kill instantly. Deep holes mean death too. A wide hole cannot be jumped: find wooden planks (early eras) or a rope (later eras) in the cave, then stand at the edge and press E or Talk. Two glowing broken relics are hidden indoors: a jar inside a cave and a copper plate inside a stone house. Step inside, press E or Talk next to one, then drag the pieces into place. Each restored relic gives <b>2 HP</b> and a Journal note.</p><button id="bk">Back</button>');document.getElementById('bk').onclick=back}

function evActive(){return PQ.e.on&&!PQ.e.done}
function evResolved(){return PIDEF.filter(d=>d.q=='e').every(d=>PQ.e.saved.includes(d.kind)||PQ.e.burned.includes(d.id)||PQ.e.items[d.id]=='got')}
function evOpen(n){const E_=PQ.e;
 if(!E_.on){pqShow(n.n,sp('Sacristan Lino','Psst. The parish is clearing out "dangerous" papers: letters, photographs, newspapers. Tonight they go into the brazier. If you can save them, future historians will thank us. Hurry, one burns every few minutes!'),[['I will save what I can.',()=>{E_.on=1;E_.clk=0;sfx('quest');say('<b>PEACE MISSION:</b> Preserve the Evidence. Find 4 papers along the road before they burn.',5000);pqClose(n)}],['Not now.',()=>pqClose(n)]]);return}
 if(E_.done){pqClose(n);return}
 if(!evResolved()){pqShow(n.n,sp('Sacristan Lino','Four papers lie along the road. Save what you can, quickly.'),[['I am on it.',()=>pqClose(n)]]);return}
 const got=PIDEF.filter(d=>d.q=='e'&&E_.items[d.id]=='got'),k=got.length;
 pqShow(n.n,k?sp('Sacristan Lino','You saved '+k+' of 4. Look at them: faces, names, words that would have turned to ash. I will hide them where they can wait for better days.'):sp('Sacristan Lino','The fire took everything. Perhaps next time we will be faster.'),[['Keep them safe.',()=>{E_.done=1;got.forEach(d=>{PQ.know.push(d.fact);NOTES.push('<b>Knowledge ('+d.name+'):</b> '+d.fact)});const art=k?ART[got[0].kind]:null;if(art){PQ.art.push(art);NOTES.push('<b>&#9733; Artifact:</b> '+art.name+'. '+art.desc)}got.slice(1).forEach(d=>{PQ.art.push(ART[d.kind])});pqXP(15*k+(k==4?20:0));if(k){sfx('quest');burst(P.x,P.y-14,14);pop(P.x,P.y-34,'+'+(15*k+(k==4?20:0))+' XP');P.hp=Math.min(HP,P.hp+2);say('<b>Peace mission complete:</b> Preserve the Evidence. '+k+'/4 saved'+(k==4?'. Nothing was lost!':'')+'. Knowledge and artifacts saved in the Journal.',5600)}PQ.out.evidence=k==4?'Spanish town: every paper saved from the fire.':k?'Spanish town: '+k+' of 4 papers saved.':'';pqClose(n)}]])}
function evUpdate(){const E_=PQ.e;if(!evActive())return;E_.clk++;for(const d of PIDEF)if(d.q=='e'&&!E_.items[d.id]&&!E_.burned.includes(d.id)&&E_.clk>d.dl*60){E_.burned.push(d.id);const m=PIT.find(p=>p.id==d.id);m.burn=1;burst(m.x,GY-8,10);pop(m.x,GY-22,'BURNED');sfx('burn');say('A paper was lost to the flames.',2200)}}

function confOpen(n){const C=PQ.c;
 if(C.done){pqClose(n);return}
 C.a=0;C.b=0;C.round=0;const step=()=>{const r=CONF[C.round];pqShow('Two camps, one argument',r.q,r.o.map(o=>[o[0],()=>{C.a+=o[1];C.b+=o[2];sfx(o[1]+o[2]>=2?'pick':'wrong');pqShow('Two camps, one argument','<i>'+o[3]+'</i>',[['Continue',()=>{C.round++;if(C.round<CONF.length)step();else conclude()}]])}]))};
 const conclude=()=>{const ok=C.a>=3&&C.b>=3,mid=!ok&&C.a>=1&&C.b>=1;
  if(ok){C.done=1;C.best='shared';pqShow('Agreement',sp('Kiko','You are right. Families first, then the day, decided together.')+'<br>'+sp('Mang Ambo','Then I will help hide the children and teach the signals.')+'<br><i>The two camps tie a cord together.</i>',[['Continue',()=>{pqClose(n);pqReward('conflict','Resolve the Conflict',60,'Revolutionary societies like the Katipunan argued over when and how to act. Leaders had to weigh urgency against the safety of ordinary families.',ART.cord,'Balintawak: two camps agreed on one plan.')}]])}
  else if(mid){C.best='uneasy';pqXP(25);pqShow('An uneasy truce',sp('Mang Ambo','We will wait a little. But I am not happy about it.')+'<br><i>The camps stop shouting, but trust is thin. You can talk to them again to try for a real agreement.</i>',[['Continue',()=>{pqClose(n);sfx('quest');say('<b>Uneasy truce.</b> +25 XP. Talk to them again for a shared plan.',4500);PQ.out.conflict='Balintawak: an uneasy truce held.'}]])}
  else{pqShow('No agreement',sp('Kiko','This is pointless!')+'<br><i>Both camps turn away. Try again with a better question, and listen first.</i>',[['Try again',()=>{C.round=0;C.a=0;C.b=0;step()}],['Leave',()=>pqClose(n)]])}};
 step()}

const WIT={
 nena:{h:'Tea? I served tea at that house on Ilaya Street the night of the meeting.',q:[['What did you see?','N1','No one carried weapons. I saw books, ledgers and umbrellas. I would have noticed a rifle with a tray in my hands.',0],['What have you heard?','H1','A rumour at the market says they stored rifles in the house. A guard told a neighbour. I did not see it myself.',1]]},
 ramon:{h:'I am the printer. People bring me all sorts of papers.',q:[['What did you see?','R1','I printed their membership forms myself. They ask only for monthly dues, a motto, and a promise to help one another. No oath of blood.',0],['What have you heard?','H2','A man in the market says they swore blood oaths. But he was not there, and that sounds like the Katipunan, which was founded days later.',1]]},
 pilo:{h:'I walk the streets at night and keep my mouth shut. Mostly.',q:[['What did you see?','P1','The guards came after the meeting began and stood outside. Nobody inside spoke of attacking anyone. The report was written the next morning by men who were not inside.',0],['What have you heard?','H3','Some say the League wanted war. Others say peace. Everyone is guessing.',1]]}};
const CLAIMS=[['"Armed men gathered to plot an uprising."','N1'],['"Members swore a blood oath to kill officials."','R1'],['"The aim was to overthrow the government by force."','P1']];
function truthOpen(n){const Tr=PQ.t;
 if(n.k=='basilio')return basilio(n);
 if(!Tr.on){pqShow(n.n,'<i>Better speak to Notary Basilio first. He is collecting testimony.</i>',[['Understood',()=>pqClose(n)]]);return}
 const d=WIT[n.k],asked=Tr.heard[n.k]=Tr.heard[n.k]||[];
 const menu=(intro)=>{const opts=[];d.q.forEach((q,i)=>{if(!asked.includes(i))opts.push([q[0],()=>{asked.push(i);Tr.rec[q[1]]={txt:q[2],hs:q[3],who:n.n.split(',')[0]};sfx('pick');pop(n.x,n.y-34,q[3]?'HEARSAY':'FIRSTHAND');menu2(i)}])});opts.push(['Thank you.',()=>pqClose(n)]);pqShow(n.n,intro,opts)};
 const menu2=(i)=>{const q=d.q[i];NOTES.push('<b>Testimony ('+n.n.split(',')[0]+', '+(q[3]?'hearsay':'firsthand')+'):</b> '+q[2]);const opts=[];d.q.forEach((qq,j)=>{if(!asked.includes(j))opts.push([qq[0],()=>{asked.push(j);Tr.rec[qq[1]]={txt:qq[2],hs:qq[3],who:n.n.split(',')[0]};sfx('pick');pop(n.x,n.y-34,qq[3]?'HEARSAY':'FIRSTHAND');menu2(j)}])});opts.push(['Thank you.',()=>pqClose(n)]);pqShow(n.n,sp(n.n.split(',')[0],q[2])+'<br><i>'+(q[3]?'Noted as hearsay: they did not see it themselves.':'Noted as a firsthand account.')+'</i>',opts)};
 menu(sp(n.n.split(',')[0],d.h))}
function basilio(n){const Tr=PQ.t;
 if(Tr.done){pqClose(n);return}
 if(!Tr.on){pqShow(n.n,sp('Notary Basilio','A guardia civil report calls the League\'s meeting an armed plot. If it stands, honest men will be punished. Speak to the people who were there. Ask what they SAW, not just what they heard.'),[['I will find the witnesses.',()=>{Tr.on=1;sfx('quest');say('<b>PEACE MISSION:</b> The Truth Behind History. Interview the witnesses, then compare their accounts to the report.',5200);pqClose(n)}],['Not now.',()=>pqClose(n)]]);return}
 const first=Object.keys(Tr.rec).filter(k=>!Tr.rec[k].hs);
 if(first.length<3){pqShow(n.n,sp('Notary Basilio','You have '+first.length+' firsthand account'+(first.length==1?'':'s')+'. I need all three witnesses: the tea seller, the printer and the night watchman.'),[['I will keep asking.',()=>pqClose(n)]]);return}
 const claim=()=>{const i=Tr.claim;if(i>=CLAIMS.length)return conclude();
   const opts=Object.keys(Tr.rec).map(k=>[Tr.rec[k].who+(Tr.rec[k].hs?' (hearsay)':' (firsthand)')+': "'+Tr.rec[k].txt.slice(0,64)+'..."',()=>{const r=Tr.rec[k];
     if(r.hs){sfx('wrong');pqShow(n.n,sp('Notary Basilio','That is hearsay. The speaker did not see it. We need firsthand evidence.'),[['Try again',claim]])}
     else if(k==CLAIMS[i][1]){sfx('pick');Tr.claim++;Tr.solved.push(i);pqShow(n.n,sp('Notary Basilio','Yes. A person who was there contradicts the claim.'),[['Next claim',claim]])}
     else{sfx('wrong');pqShow(n.n,sp('Notary Basilio','That account is true, but it does not answer this claim. Look again.'),[['Try again',claim]])}}]);
   pqShow('Compare the accounts','<i>Claim '+(i+1)+' of 3 in the official report:</i><br>'+CLAIMS[i][0]+'<br>Which testimony answers it?',opts)};
 const conclude=()=>pqShow('What does the evidence show?','All three claims fall apart against firsthand testimony. What do you tell the notary?',[['La Liga Filipina was a civic league for unity, reform and mutual aid, not an armed plot.',()=>{Tr.done=1;pqShow(n.n,sp('Notary Basilio','Exactly. I will write a true account and keep it with the parish papers. Evidence beats rumour.'),[['Continue',()=>{pqClose(n);pqReward('truth','The Truth Behind History',70,'La Liga Filipina, founded on July 3, 1892, aimed for unity, mutual protection, education, farming and trade. Rizal was arrested within days, and the report that called it a plot rested on rumour, not on witnesses.',ART.seal,'Tondo: evidence proved La Liga was no plot.')}]])}],['It was a secret army preparing to attack Manila.',()=>{sfx('wrong');pqShow(n.n,sp('Notary Basilio','Check your evidence again. No witness saw weapons.'),[['Think again',conclude]])}],['No one can ever know what happened.',()=>{sfx('wrong');pqShow(n.n,sp('Notary Basilio','We can know a great deal by comparing firsthand accounts.'),[['Think again',conclude]])}]]);

function shatter(def){
  var big=document.createElement('canvas');big.width=big.height=N0;def.art(big);
  var cv=document.createElement('canvas');cv.width=cv.height=N;
  var c0=cv.getContext('2d');c0.imageSmoothingEnabled=true;try{c0.imageSmoothingQuality='high'}catch(_){}
  c0.drawImage(big,0,0,N,N);
  var k0=N/N0,S_=def.seeds.map(function(s){return [s[0]*k0,s[1]*k0]});
  var ctx=cv.getContext('2d'),ad=ctx.getImageData(0,0,N,N),d=ad.data,own=new Int16Array(N*N).fill(-1),i,x,y;
  for(y=0;y<N;y++)for(x=0;x<N;x++){
    if(d[(y*N+x)*4+3]<20)continue;
    var best=1e9,bi=0;
    for(i=0;i<S_.length;i++){
      var dx=x-S_[i][0],dy=y-S_[i][1],dd=Math.sqrt(dx*dx+dy*dy)+Math.sin(x*.21+y*.09+i*2)*3+Math.sin(y*.27-x*.13+i)*3;
      if(dd<best){best=dd;bi=i}
    }
    own[y*N+x]=bi;
  }
  var pcs=[];
  for(i=0;i<S_.length;i++){
    var minx=N,miny=N,maxx=-1,maxy=-1;
    for(y=0;y<N;y++)for(x=0;x<N;x++)if(own[y*N+x]===i){if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}
    if(maxx<0)continue;
    var w=maxx-minx+1,h=maxy-miny+1,pc=document.createElement('canvas');pc.width=w;pc.height=h;
    var pctx=pc.getContext('2d'),im=pctx.createImageData(w,h),al=new Uint8Array(w*h);
    for(y=miny;y<=maxy;y++)for(x=minx;x<=maxx;x++){
      var p=y*N+x;if(own[p]!==i)continue;
      var o=((y-miny)*w+(x-minx))*4,s=p*4,crack=false;
      if(x>0&&own[p-1]>=0&&own[p-1]!==i)crack=true;
      if(y>0&&own[p-N]>=0&&own[p-N]!==i)crack=true;
      if(x<N-1&&own[p+1]>=0&&own[p+1]!==i)crack=true;
      if(y<N-1&&own[p+N]>=0&&own[p+N]!==i)crack=true;
      var f=crack?.45:1;
      im.data[o]=d[s]*f;im.data[o+1]=d[s+1]*f;im.data[o+2]=d[s+2]*f;im.data[o+3]=d[s+3];al[(y-miny)*w+(x-minx)]=1;
    }
    pctx.putImageData(im,0,0);
    pcs.push({cv:pc,w:w,h:h,ox:minx,oy:miny,al:al,x:0,y:0,lock:false});
  }
  return {art:cv,pcs:pcs};
}

'Started in the early colony under Legazpi as a way to reward soldiers and settlers without paying them from the Crown’s treasury.',
'The Spaniard who held the grant was the encomendero. Tribute was paid in cash or goods such as gold, cloth and rice.',
'In return he was supposed to protect the people, keep order, and support the missionaries.',
'Abuses were common. Churchmen such as Bishop Domingo de Salazar criticized them, and the system faded as the Crown took over tribute collection.']},
{h:'The 1521 expedition',p:[
'The Spanish fleet left Spain in 1519 to reach the Spice Islands by sailing west. Its captain-general was Portuguese-born.',
'It reached the islands in March 1521. In Cebu, Rajah Humabon and his people accepted baptism.',
'On April 27, 1521, the captain-general was killed at Mactan fighting the warriors of the chieftain who refused to submit. The surviving ships continued and completed the first voyage around the world in 1522 under Juan Sebastián Elcano.',
'Later: Villalobos (1543) named the islands Las Islas Filipinas after Prince Philip. Legazpi settled Cebu in 1565 and took Manila in 1571, making it the capital.']},
{h:'The secret society of 1892',p:[
'Background: the Propaganda Movement (Rizal, Marcelo H. del Pilar, Graciano López Jaena) asked Spain for reforms through writing, mainly in La Solidaridad.',
'La Liga Filipina, a civic reform society, was founded by Rizal in Tondo on July 3, 1892. He was arrested days later and deported to Dapitan. Part of its membership continued as the reformist Cuerpo de Compromisarios.',
'On July 7, 1892, in Tondo, a different group founded a secret society that sought independence by armed revolution. Its leader was called the Supremo.',
'It used a secret oath and a blood compact, and published the newspaper Kalayaan. Emilio Jacinto was its key writer.',
'It was discovered in August 1896, which led to the Cry of Pugad Lawin and the outbreak of the revolution.']},
{h:'Forced labor under Spain',p:[
'Men roughly 16 to 60 years old had to give free labor on public works: roads, bridges, churches and ships (galleons built at Cavite).',
'It was originally 40 days a year and was cut to 15 days in 1884. A man could be exempted by paying a fee (the falla).',
'Cabezas de barangay and principales were exempt.',
'Do not confuse it with other burdens: the yearly tribute, and bandala, the forced sale of goods (like rice) to the government at fixed, low prices.']},
{h:'The 1898 peace agreement',p:[
'The Spanish-American War began in April 1898 over Cuba. On May 1, 1898, Commodore George Dewey destroyed the Spanish fleet in Manila Bay.',
'On August 13, 1898, Spain surrendered Manila to the Americans in a staged “mock battle”, with Filipino forces kept out of the city.',
'Spain and the United States negotiated in Paris without Filipino representatives. It was signed on December 10, 1898.',
'Terms: Spain gave up the Philippines, Guam and Puerto Rico, and the United States paid $20 million. The US Senate ratified it in February 1899 by a very narrow margin.']},
{h:'War with the United States',p:[
'Filipinos had declared independence in 1898 and expected recognition, but the United States took over from Spain.',
'On the night of February 4, 1899, an American sentry shot a Filipino soldier near the San Juan bridge in Manila, and fighting spread across the city.',
'The Republic formally declared war on June 2, 1899. Gen. Antonio Luna, its best-known commander, was assassinated on June 5, 1899.',
'After conventional defeats, Filipino forces turned to guerrilla warfare in November 1899. President Theodore Roosevelt declared the war over on July 4, 1902, though fighting continued in some areas.']},
{h:'The defense of Tirad Pass',p:[
'After the fall of Malolos in March 1899, Aguinaldo’s government retreated north through Tarlac, Pangasinan and Nueva Vizcaya, chased by American columns.',
'On December 2, 1899, a small force of about 60 men held a narrow mountain pass in Ilocos Sur against a much larger American force under Major Peyton March.',
'Their commander, only 24 years old, died there. The delay let Aguinaldo escape. The Americans buried him with honors.',
'Other generals: Antonio Luna (assassinated in 1899), Miguel Malvar (continued the guerrilla war in Batangas and surrendered in 1902), Artemio Ricarte (refused to swear allegiance to the US and was exiled).']},
{h:'Aguinaldo’s chief adviser',p:[
'A lawyer from Tanauan, Batangas, who was paralyzed by illness in 1896, which earned him the nickname “Sublime Paralytic”.',
'He joined Aguinaldo’s government in 1898 and wrote the Constitutional Program of the Philippine Republic and the True Decalogue.',
'In January 1899 he became president of the cabinet and secretary of foreign affairs. He resigned in May 1899 after disagreements over how to deal with the Americans.',
'Captured in December 1899 and exiled to Guam in 1901. He returned in 1903 and died of cholera that year.']},
{h:'The first president of the republic',p:[
'He led the Cavite branch of the revolution, won important battles in Cavite in 1896, and was elected head of the revolutionary government at the Tejeros Convention (March 1897). Andrés Bonifacio, the Supremo of the secret society, was executed in May 1897.',
'The republic was inaugurated on January 23, 1899, at Barasoain Church in Malolos, Bulacan, which was its seat of government.',
'The republic did not last long: it was effectively ended with the capture of its leader in 1901.',
'Do not confuse him with leaders of the Commonwealth era (1935 onward), such as Manuel L. Quezon.']},
{h:'The 1899 constitution',p:[
'The Malolos Congress met at Barasoain Church on September 15, 1898. Felipe Calderón’s draft was chosen over Mabini’s Constitutional Program.',
'It was approved by the Congress in November 1898 and promulgated on January 21, 1899.',
'Key features: popular sovereignty, a bill of rights, separation of church and state, a single legislative assembly, and a president elected by that assembly.',
'Other constitutions: an earlier provisional one was drafted in 1897 at the revolution’s mountain hideout but never fully took effect. The 1935 constitution belongs to the Commonwealth, and the 1987 constitution came after the 1986 People Power revolution.']},
{h:'Aguinaldo’s government of 1898',p:[
'Aguinaldo returned from exile in Hong Kong on May 19, 1898, aboard an American ship, during the Spanish-American War.',
'On May 24, 1898, he issued a decree creating a temporary government in which he held all powers, to unify command during the war against Spain.',
'It was meant to last only until independence was secure. On June 23, 1898, it was replaced by a revolutionary government with a cabinet, and later by the republic of 1899.',
'The Americans were not part of it. The Commonwealth (1935) and the American Civil Government (1901) came much later.']},
{h:'June 12, 1898',p:[
'Aguinaldo had returned in May and Spanish power was collapsing after Dewey’s victory in Manila Bay.',
'The proclamation took place in Cavite province, in front of a large crowd. The Act of Declaration was prepared by Ambrosio Rianzares Bautista.',
'The flag, sewn in Hong Kong by Marcela Agoncillo, her daughter Lorenza and Delfina Herbosa de Natividad, was unfurled, and the Marcha Nacional Filipina, composed by Julián Felipe, was played.',
'Neither Spain nor the United States recognized it. June 12 became the official Independence Day in 1962. Contrast it with the Cry of Pugad Lawin (August 1896), which began the revolution, and the treaty of December 1898.']},
{h:'The December 1897 truce',p:[
'After Spanish offensives drove the revolution out of Cavite, Aguinaldo set up a republic in a mountain hideout in Bulacan in late 1897.',
'Pedro Paterno acted as go-between. In December 1897 an agreement was made: the Spanish promised amnesty, reforms and a payment of 800,000 pesos in installments.',
'Aguinaldo and about 25 other leaders left for exile in Hong Kong on December 27, 1897.',
'The reforms were never fully carried out, and Aguinaldo returned in May 1898 with American support, so the fighting resumed.']},
{h:'The capture of Aguinaldo',p:[
'Since escaping north in 1899, Aguinaldo had kept moving and finally hid in a remote town in Isabela, about two years after the war began.',
'Gen. Frederick Funston led the operation. His men used a ruse, with Macabebe scouts posing as reinforcements and American officers as their prisoners.',
'Aguinaldo was taken to Manila on the USS Vicksburg. Weeks later he swore allegiance to the United States and urged his followers to lay down their arms.',
'It was a heavy blow to the resistance, though some commanders, such as Miguel Malvar, kept fighting until 1902.']}];

function notes(list){return list.map(function(x,k){return '<div class="frag"><b>'+(k+1)+'. '+esc(x.r.h)+'</b><ul style="margin:.3em 0 0;padding-left:1.1em">'+x.r.p.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>'}).join('')}
function cards(list){return list.map(function(x){return '<div class="frag"><b>'+esc(x.q)+'</b><br>Answer: <b>'+L[x.a]+'. '+esc(x.o[x.a])+'</b><br><i>'+esc(x.n)+'</i></div>'}).join('')}

function reviewer(i){
 var s=SEC[i],n=0,h='<h2>Reviewer</h2><p>'+SEC.map(function(z,k){return '<button id="t'+k+'"'+(k==i?' disabled style="opacity:.55"':'')+'>'+esc(z.s)+'</button>'}).join('')+'</p>';
 h+='<p><b>'+esc(s.t)+'</b><br>'+esc(s.blurb)+'</p>'+notes(s.q)+'<button id="qz">Quiz this section</button><button id="bk">Back</button>';

}

function quiz(sel,custom){
 var pool=custom||(sel<0?SEC[0].q.concat(SEC[1].q):SEC[sel].q),qs=shuf(pool),i=0,score=0,missed=[];
 function ask(){
  var x=qs[i],opts=shuf(x.o.map(function(t,k){return {t:t,c:k==x.a}}));
  var h='<h2>Question '+(i+1)+' of '+qs.length+'</h2><p><small>Score: '+score+'</small></p><p>'+esc(x.q)+'</p>';
  opts.forEach(function(o,k){h+='<button class="lq" data-k="'+k+'">'+L[k]+'. '+esc(o.t)+'</button>'});
  scr(h);
  ov.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){
   var o=opts[+b.dataset.k],ok=o.c;if(ok){score++;snd('pick')}else{missed.push(x);snd('wrong')}
   var ci=opts.findIndex(function(z){return z.c});
   scr('<h2>'+(ok?'Correct!':'Not quite')+'</h2><p>'+(ok?'':'The answer is <b>'+L[ci]+'. '+esc(opts[ci].t)+'</b>.<br>')+'<i>'+esc(x.n)+'</i></p><button id="nx">'+(i+1<qs.length?'Next question':'See results')+'</button>');
   wire({nx:function(){i++;if(i<qs.length)ask();else end()}},'nx')}});
  var f=ov.querySelector('[data-k]');if(f)f.focus();
 }
 function end(){
  var p=Math.round(score/qs.length*100),rk=p>=90?'Master Historian':p>=70?'Chronicler':p>=50?'Apprentice Scribe':'Keep reading the books',nb='';
  if(!custom&&sel<0&&score>bestGet()){bestSet(score);nb=' New best score!'}
  snd(p>=70?'quest':'wrong');
  scr('<h2>Results</h2><p>You scored <b>'+score+' / '+qs.length+'</b> ('+p+'%).<br>Rank: <b>'+rk+'</b>.'+nb+'</p>'+
   (missed.length?'<p>Missed: '+missed.length+'. Review them, then try again.</p><button id="rm">Review missed</button>':'<p>A perfect run. The dates are real history.</p>')+
   '<button id="ra">Play again</button><button id="mn">Reviewer menu</button>');
  var m={ra:function(){quiz(sel,custom)},mn:hub};
  if(missed.length)m.rm=function(){
   scr('<h2>Missed questions</h2>'+cards(missed)+'<button id="rq">Quiz me on these</button><button id="bk">Back</button>');
   wire({rq:function(){quiz(sel,missed)},bk:end},'rq');var bx=ov.querySelector('.box');if(bx)bx.scrollTop=0};
  wire(m,missed.length?'rm':'ra');
 }
 ask();
}

 '<p>The story follows an astronaut whose mission is to travel across the universe and study black holes to discover phenomena that humanity has not yet fully understood. However, his mission takes an unexpected turn when he accidentally enters a wormhole that transports him into a different timeline. Instead of remaining in the year 2026, he finds himself in the year 1521, where he encounters the realities of the Spanish colonial period in the Philippines.</p>'+

 '<button id="bk">Back</button>');
